<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URAJI つまみ</title>
<style>
  :root {
    --t-bg: #ebebe9; --t-panel: #f7f7f6; --t-line: #d2d2ce; --t-ink: #1b1b1a; --t-mute: #62625e;
    --m-bg: #0b0c10; --m-ink: #f1ede4; --m-glow: #b8ff5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--t-bg); color: var(--t-ink); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--t-line); background: var(--t-panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header p { margin: 0; color: var(--t-mute); font-size: 12.5px; flex: 1; min-width: 240px; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--t-ink); background: #fff; color: var(--t-ink); padding: 6px 12px; border-radius: 0; cursor: pointer; }
  button.primary { background: var(--t-ink); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--t-ink); outline-offset: 2px; }
  aside { border-right: 1px solid var(--t-line); background: var(--t-panel); padding: 14px 16px 24px; }
  .grp { margin: 0 0 16px; }
  .grp h2 { font-size: 11.5px; letter-spacing: .14em; color: var(--t-mute); margin: 0 0 6px; font-weight: 700; }
  .knob { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 0 0 8px; }
  .knob label { font-size: 13px; user-select: none; cursor: default; }
  .knob label.changed::after { content: " ●"; font-size: 9px; vertical-align: 2px; }
  .knob output { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--t-mute); }
  .knob input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: #2a2a28; margin: 2px 0 0; }
  .derived { font-size: 12px; color: var(--t-mute); border-top: 1px solid var(--t-line); padding-top: 8px; margin-top: 4px; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .toggles label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 0 0 6px; }
  .note { font-size: 12px; color: var(--t-mute); margin: 8px 0 0; }
  main { padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .stage { background: var(--m-bg); padding: 18px 20px; }
  .stage canvas { display: block; width: 100%; }
  textarea { width: 100%; font: inherit; font-size: 13px; border: 1px solid var(--t-line); background: #fff; padding: 6px 8px; resize: vertical; min-height: 64px; border-radius: 0; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .row strong { font-size: 12.5px; }
  .snaps { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; min-height: 20px; }
  .snap { flex: 0 0 auto; border: 1px solid var(--t-line); background: #fff; padding: 6px; cursor: pointer; position: relative; width: 186px; text-align: left; }
  .snap:hover { border-color: var(--t-ink); }
  .snap canvas { display: block; width: 100%; height: 52px; background: var(--m-bg); }
  .snap .meta { font-size: 11px; color: var(--t-mute); margin-top: 4px; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .snap .x { position: absolute; top: 0; right: 0; border: 0; background: transparent; padding: 2px 7px; font-size: 15px; color: var(--t-mute); }
  .empty { font-size: 12px; color: var(--t-mute); }
  .status { font-size: 12.5px; background: #fff; border: 1px solid var(--t-ink); padding: 8px 10px; display: none; }
  .status.on { display: block; }
  .status pre { margin: 6px 0 0; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--t-line); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>URAJI つまみ</h1>
    <p>字形はすべて左のつまみから組み立てている。どのつまみも全部の字に同時に効く。黒い面が書体、灰色が道具。</p>
    <a href="https://claude.ai/artifact/51KpKXTyAqecGQS2kp2hRK" style="font-size:12.5px;color:var(--t-ink)">使い方（裏フェス フォント）</a>
    <button id="reset" type="button">今の書体の値に戻す</button>
    <button id="snap" type="button">スナップショット</button>
    <button id="decide" class="primary" type="button">この値で決める</button>
  </header>
  <aside>
    <div id="knobs"></div>
    <div class="derived" id="derived"></div>
    <div class="grp toggles" style="margin-top:14px">
      <h2>表示</h2>
      <label><input type="checkbox" id="ss01"> 型紙セット（ss01）</label>
      <label><input type="checkbox" id="guide"> ガイド線（ベースライン・字の高さ・線）</label>
    </div>
    <p class="note">つまみの名前をダブルクリックすると、そのつまみだけ今の書体の値に戻る。● は今の書体から動かしたつまみ。</p>
  </aside>
  <main>
    <div class="status" id="status" role="status"></div>
    <textarea id="text" spellcheck="false" aria-label="見本の文字（1行ずつ）">URAFESS
裏フェス 21:30
ケイドロ → START</textarea>
    <div class="stage"><canvas id="stage" aria-label="見本の文字"></canvas></div>
    <div class="row"><strong>スナップショット</strong><span class="note" style="margin:0">押した時点の値を並べて比べる。カードを押すとその値に戻る。</span></div>
    <div class="snaps" id="snaps"><span class="empty">まだない。</span></div>
    <div class="row"><strong>全部の字</strong><span class="note" style="margin:0" id="count"></span></div>
    <div class="stage"><canvas id="grid" aria-label="全部の字"></canvas></div>
  </main>
</div>

<script>/*
 * URAJI（裏字）— 字形の正本
 * すべての字は、統一層 P のつまみから組み立てる「演算の木」として書く。
 *   ["path", cmds]           cmds: ["M",x,y] ["L",x,y] ["C",x1,y1,x2,y2,x,y] ["Z"]
 *   ["U", ...]  和   ["D", a, ...b]  差   ["I", a, b]  積   ["X", [a,b,c,d,e,f], node]  変形
 * ブラウザ（つまみの道具）は木を canvas で描き、フォントの生成は木を Python（pathops）で読む。
 * 同じ木から作るので、道具で見た形とフォントの形は一致する。
 */
(function (root) {
  "use strict";

  const DEFAULTS = {
    H: 700,      // 大文字の高さ
    V: 160,      // 縦画の太さ
    B: 136,      // 横画の太さ
    R: 190,      // 丸い角の外半径
    K: 0.60,     // 角の張り（0.55≒円弧。大きいほど四角寄り）
    SLIT: 0.618, // 線（切れ目）の中心の高さ。H に対する比
    T: 40,       // 線の厚さ（0 で線なし＝ベタ）
    SB: 62,      // 縦画側の字間
    WX: 1.0,     // 字幅の倍率（英数字のみ）
  };

  const KNOBS = [
    { key: "SLIT", label: "線の高さ", group: "線", min: 0.50, max: 0.74, step: 0.001, fmt: (v) => v.toFixed(3) },
    { key: "T", label: "線の厚さ", group: "線", min: 0, max: 90, step: 1, fmt: (v) => String(Math.round(v)) },
    { key: "V", label: "縦画の太さ", group: "骨", min: 100, max: 210, step: 1, fmt: (v) => String(Math.round(v)) },
    { key: "B", label: "横画の太さ", group: "骨", min: 90, max: 176, step: 1, fmt: (v) => String(Math.round(v)) },
    { key: "WX", label: "字幅", group: "骨", min: 0.82, max: 1.24, step: 0.01, fmt: (v) => v.toFixed(2) },
    { key: "R", label: "角の半径", group: "角", min: 0, max: 280, step: 1, fmt: (v) => String(Math.round(v)) },
    { key: "K", label: "角の張り", group: "角", min: 0.50, max: 0.82, step: 0.01, fmt: (v) => v.toFixed(2) },
    { key: "SB", label: "字間", group: "字間", min: 20, max: 120, step: 1, fmt: (v) => String(Math.round(v)) },
  ];

  const KERN = [
    ["L", "T", -70], ["L", "V", -50], ["L", "Y", -60], ["L", "W", -34], ["L", "quotesingle", -70], ["L", "quotedbl", -70], ["L", "O", -16],
    ["T", "A", -24], ["T", "comma", -70], ["T", "period", -70], ["T", "J", -44], ["T", "hyphen", -40],
    ["F", "A", -24], ["F", "comma", -60], ["F", "period", -60], ["F", "J", -44],
    ["P", "A", -24], ["P", "comma", -60], ["P", "period", -60], ["P", "J", -44],
    ["V", "comma", -60], ["V", "period", -60], ["W", "comma", -50], ["W", "period", -50], ["Y", "comma", -64], ["Y", "period", -64],
    ["V", "A", -16], ["W", "A", -12], ["Y", "A", -18], ["A", "T", -24], ["A", "V", -16], ["A", "W", -12], ["A", "Y", -18],
    ["R", "T", -16], ["R", "V", -20], ["R", "W", -14], ["R", "Y", -24],
    ["K", "O", -22], ["K", "C", -22], ["K", "G", -22], ["K", "Q", -22], ["X", "O", -16],
    ["seven", "period", -60], ["seven", "comma", -60],
  ];

  // ---------- 演算の木 ----------
  const U = (...ps) => ["U", ...ps.filter(Boolean)];
  const D = (a, ...bs) => ["D", a, ...bs.filter(Boolean)];
  const I = (a, b) => ["I", a, b];
  const X = (m, a) => ["X", m, a];
  const O = (a, e) => ["O", e, a];       // 太らせる（輪郭を e だけ外へ）
  const EMPTY = ["U"];

  function rect(x0, y0, x1, y1) {
    return ["path", [["M", x0, y0], ["L", x1, y0], ["L", x1, y1], ["L", x0, y1], ["Z"]]];
  }
  function poly(pts) {
    const c = [["M", pts[0][0], pts[0][1]]];
    for (let i = 1; i < pts.length; i++) c.push(["L", pts[i][0], pts[i][1]]);
    c.push(["Z"]);
    return ["path", c];
  }
  function mirrorX(node, w) { return X([-1, 0, 0, 1, w, 0], node); }
  function mirrorY(node, h) { return X([1, 0, 0, -1, 0, h], node); }
  function scaleAt(node, s, cx, cy) { return X([s, 0, 0, s, cx - s * cx, cy - s * cy], node); }
  function move(node, dx, dy) { return X([1, 0, 0, 1, dx, dy], node); }

  function build(params) {
    const P = Object.assign({}, DEFAULTS, params || {});
    const H = P.H, V = P.V, B = P.B, R = P.R, T = P.T, K = P.K, WX = P.WX;
    const S0 = Math.round(H * P.SLIT - T / 2);   // 線の下端
    const S1 = S0 + T;                           // 線の上端
    const M1 = S0;                               // 中間画の上端＝線の下端
    const M0 = M1 - B;                           // 中間画の下端
    const SB = P.SB;
    const st = SB, rd = Math.round(SB * 0.8), dg = Math.round(SB * 0.35), tb = Math.round(SB * 0.5);
    const Rs = Math.min(170, R);                 // S・2 の背骨の角
    const ww = (w) => Math.round(w * WX);

    function rr(x0, y0, x1, y1, tl = 0, tr = 0, br = 0, bl = 0, k = K) {
      const w = x1 - x0, h = y1 - y0;
      const r2 = (r) => {
        let rx, ry;
        if (Array.isArray(r)) { rx = r[0]; ry = r[1]; } else { rx = r; ry = r; }
        rx = Math.max(0, Math.min(rx, w / 2)); ry = Math.max(0, Math.min(ry, h / 2));
        return (rx < 1 || ry < 1) ? [0, 0] : [rx, ry];
      };
      const [tlx, tly] = r2(tl), [trx, try_] = r2(tr), [brx, bry] = r2(br), [blx, bly] = r2(bl);
      const c = [["M", x0 + blx, y0], ["L", x1 - brx, y0]];
      if (brx) c.push(["C", x1 - brx + k * brx, y0, x1, y0 + bry - k * bry, x1, y0 + bry]);
      c.push(["L", x1, y1 - try_]);
      if (trx) c.push(["C", x1, y1 - try_ + k * try_, x1 - trx + k * trx, y1, x1 - trx, y1]);
      c.push(["L", x0 + tlx, y1]);
      if (tlx) c.push(["C", x0 + tlx - k * tlx, y1, x0, y1 - tly + k * tly, x0, y1 - tly]);
      c.push(["L", x0, y0 + bly]);
      if (blx) c.push(["C", x0, y0 + bly - k * bly, x0 + blx - k * blx, y0, x0 + blx, y0]);
      c.push(["Z"]);
      return ["path", c];
    }
    function ring(x0, y0, x1, y1, tl = 0, tr = 0, br = 0, bl = 0, v = V, b = B) {
      const inn = (r) => {
        let rx, ry;
        if (Array.isArray(r)) { rx = r[0]; ry = r[1]; } else { rx = r; ry = r; }
        if (rx <= 0 || ry <= 0) return 0;
        return [Math.max(rx - v, 0), Math.max(ry - b, 0)];
      };
      return D(rr(x0, y0, x1, y1, tl, tr, br, bl), rr(x0 + v, y0 + b, x1 - v, y1 - b, inn(tl), inn(tr), inn(br), inn(bl)));
    }
    function diag(xa, ya, xb, yb, t) {
      const dx = xb - xa, dy = yb - ya;
      const s = Math.abs(dy) / Math.max(Math.hypot(dx, dy), 1e-6);
      const w = t / Math.max(s, 0.2);

    const G = [];            // {name, u, w, l, r, tree, abs, notch}
    const byName = {};

      const ymin = opt.ymin ?? 0, ymax = opt.ymax ?? H;
      if (opt.clip !== false) tree = I(tree, rect(0, ymin, w, ymax));
      const g = { name, u, w, l, r, tree, abs: false, notch: opt.notch || [] };
      G.push(g); byName[name] = g; return g;
    }
    function addabs(name, u, adv, tree, opt = {}) {
      const g = { name, u, w: adv, l: 0, r: 0, tree, abs: true, notch: opt.notch || [] };
      G.push(g); byName[name] = g; return g;
    }
    const lowerNotch = (yLo, yHi) => { const mid = (yLo + yHi) / 2; return rect(-1, mid - T / 2, V + 1, mid + T / 2); };

    // ===== 英字 =====
    let W = ww(540);
    add("A", [0x41, 0x61], W, st, st, U(D(rr(0, 0, W, H, R, R), rr(V, -10, W - V, H - B, [R - V, R - B], [R - V, R - B])), rect(V - 2, M0, W - V + 2, M1)));

    W = ww(520);
    add("B", [0x42, 0x62], W, st, rd, U(ring(0, M0, W - 24, H, 0, R, R, 0), ring(0, 0, W, M1, 0, R, R, 0)), { notch: [lowerNotch(B, M0)] });

    W = ww(520);
    add("C", [0x43, 0x63], W, rd, tb, D(ring(0, 0, W, H, R, R, R, R), rect(W - V - 2, R, W + 2, H - R)));

    W = ww(540);
    add("D", [0x44, 0x64], W, st, rd, ring(0, 0, W, H, 0, R, R, 0));

    W = ww(470);
    add("E", [0x45, 0x65], W, st, tb, U(rect(0, 0, V, H), rect(0, H - B, W, H), rect(0, M0, W - 34, M1), rect(0, 0, W, B)));

    W = ww(450);
    add("F", [0x46, 0x66], W, st, tb, U(rect(0, 0, V, H), rect(0, H - B, W, H), rect(0, M0, W - 34, M1)));

    W = ww(540);
    add("G", [0x47, 0x67], W, rd, rd, U(D(ring(0, 0, W, H, R, R, R, R), rect(W - V - 2, M1, W + 2, H - R)), rect(W * 0.47, M0, W, M1)));

    W = ww(540);
    add("K", [0x4B, 0x6B], W, st, dg, U(rect(0, 0, V, H), diag(V - 10, 250, W - 78, H + 40, 152), diag(V + 118, 360, W - 78, -40, 168)));

    W = ww(440);
    add("L", [0x4C, 0x6C], W, st, tb, U(rect(0, 0, V, H), rect(0, 0, W, B)));

    W = ww(690);
    add("M", [0x4D, 0x6D], W, st, st, U(rect(0, 0, V, H), rect(W - V, 0, W, H), diag(V * 0.45, H + 20, W / 2, 170, 148), diag(W - V * 0.45, H + 20, W / 2, 170, 148)));

    W = ww(560);
    add("N", [0x4E, 0x6E], W, st, st, U(rect(0, 0, V, H), rect(W - V, 0, W, H), diag(V * 0.42, H + 30, W - V * 0.42, -30, 158)));

    ctx.save();
    ctx.fillStyle = "rgba(150,150,145,.22)";
    ctx.fillRect(0, y(model.geo.S1), W * dpr, y(model.geo.S0) - y(model.geo.S1));
    ctx.strokeStyle = "rgba(170,170,165,.75)"; ctx.lineWidth = 1 * dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    for (const u of [0, model.geo.H]) { ctx.beginPath(); ctx.moveTo(0, y(u)); ctx.lineTo(W * dpr, y(u)); ctx.stroke(); }
    ctx.restore();
  }

  let model = buildModel(P);
  function renderStage() {
    const cv = $("stage"), W = cv.clientWidth || 800;
    const lines = $("text").value.split("\n").map((l) => l.trimEnd()).filter((l) => l.length).slice(0, 6);
    if (!lines.length) lines.push("URAFESS");
    const items = lines.map((l) => layout(model, l));
    const maxU = Math.max(1200, ...items.map(units));
    const px = Math.max(28, Math.min(150, Math.floor(W * 1000 / maxU)));
    const lh = Math.round(px * 1.2), H = lines.length * lh + Math.round(px * 0.2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
    const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height);
    items.forEach((it, i) => {
      const base = i * lh + px * 0.95;
      if (guide) drawGuides(ctx, model, base, px, W);
      drawLine(ctx, model, it, 0, base, px, INK);
    });
  }
  function gridGlyphs() {
    return model.b.glyphs.filter((g) => !g.name.endsWith(".ss01") && g.u.length && g.name !== "space" && g.name !== "uni3000")
      .map((g) => (ss && model.byName.get(g.name + ".ss01")) || g);
  }
  function renderGrid() {
    const cv = $("grid"), W = cv.clientWidth || 800;
    const list = gridGlyphs();
    const px = W < 600 ? 40 : 54, cw = Math.round(px * 1.32), ch = Math.round(px * 1.42);
    const cols = Math.max(1, Math.floor(W / cw)), rows = Math.ceil(list.length / cols);
    const H = rows * ch;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
    const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height);
    list.forEach((g, i) => {
      const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch;
      const base = cy + px * 1.05;
      if (guide) {
        ctx.save(); ctx.fillStyle = "rgba(150,150,145,.18)";
        ctx.fillRect(cx * dpr, (base - model.geo.S1 * px / 1000) * dpr, (cw - 6) * dpr, (model.geo.S1 - model.geo.S0) * px / 1000 * dpr); ctx.restore();
      }
      drawGlyph(ctx, model, g, cx + (cw - g.adv * px / 1000) / 2, base, px, INK);
    });
    $("count").textContent = list.length + " 字";
  }

  // ---------- つまみ ----------
  const knobsEl = $("knobs");
  const groups = {};
  for (const k of UR.KNOBS) {
    if (!groups[k.group]) {
      const g = document.createElement("div"); g.className = "grp";
      g.innerHTML = "<h2>" + k.group + "</h2>"; knobsEl.appendChild(g); groups[k.group] = g;
    }
    const row = document.createElement("div"); row.className = "knob";
    row.innerHTML = '<label for="k_' + k.key + '">' + k.label + '</label><output id="o_' + k.key + '"></output>' +
      '<input type="range" id="k_' + k.key + '" min="' + k.min + '" max="' + k.max + '" step="' + k.step + '">';
    groups[k.group].appendChild(row);
    const input = row.querySelector("input"), label = row.querySelector("label");
    input.addEventListener("input", () => { P[k.key] = parseFloat(input.value); syncKnobs(); schedule(); });
    label.addEventListener("dblclick", () => { P[k.key] = DEF[k.key]; syncKnobs(); schedule(); });
  }
  function syncKnobs() {
    for (const k of UR.KNOBS) {
      $("k_" + k.key).value = P[k.key];
      $("o_" + k.key).textContent = k.fmt(P[k.key]);
      document.querySelector('label[for="k_' + k.key + '"]').classList.toggle("changed", Math.abs(P[k.key] - DEF[k.key]) > 1e-9);
    }
    const g = UR.build(Object.assign({}, P)).geo;
    $("derived").innerHTML =
      "裏 : 表 ＝ " + (P.SLIT / (1 - P.SLIT)).toFixed(3) + " : 1<br>" +
      "線の厚さ ＝ 字の高さの " + (P.T / P.H * 100).toFixed(1) + "%" + (P.T === 0 ? "（線なし＝ベタ）" : "") + "<br>" +
      "線 " + g.S0 + "〜" + g.S1 + " ／ 中間画 " + g.M0 + "〜" + g.M1 + "（単位 1/1000）";
  }

  let raf = 0, gridTimer = 0;
  function schedule() {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; model = buildModel(P); renderStage(); });
    clearTimeout(gridTimer); gridTimer = setTimeout(() => renderGrid(), 160);
  }
  $("text").addEventListener("input", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderStage(); }); });
  $("ss01").addEventListener("change", (e) => { ss = e.target.checked; renderStage(); renderGrid(); });
  $("guide").addEventListener("change", (e) => { guide = e.target.checked; renderStage(); renderGrid(); });
  $("reset").addEventListener("click", () => { P = Object.assign({}, DEF); syncKnobs(); schedule(); });
  let resizeT = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { renderStage(); renderGrid(); }, 120); });

  // ---------- スナップショットと「決める」 ----------
  let db = null, snaps = [], local = false;
  const thumbs = new Map();
  const summary = (p) => "線 " + p.SLIT.toFixed(3) + "/" + Math.round(p.T) + " ・縦 " + Math.round(p.V) + " 横 " + Math.round(p.B) +
    "<br>幅 " + p.WX.toFixed(2) + " ・角 " + Math.round(p.R) + "/" + p.K.toFixed(2) + " ・字間 " + Math.round(p.SB);
  function status(html) { const s = $("status"); s.innerHTML = html; s.classList.toggle("on", !!html); }
  function cleanParams(p) { const o = {}; for (const k of UR.KNOBS) o[k.key] = +p[k.key]; o.H = DEF.H; return o; }
  function renderSnaps() {
    const box = $("snaps"); box.innerHTML = "";
    if (!snaps.length) { box.innerHTML = '<span class="empty">まだない。</span>'; return; }
    for (const s of snaps) {
      const card = document.createElement("div"); card.className = "snap"; card.tabIndex = 0; card.setAttribute("role", "button");
      const cv = document.createElement("canvas");
      const meta = document.createElement("div"); meta.className = "meta";
      meta.innerHTML = summary(Object.assign({}, DEF, s.params));
      const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "このスナップショットを消す");
      card.append(cv, meta, x); box.appendChild(card);
      requestAnimationFrame(() => drawThumb(cv, s));
      const apply = () => { P = Object.assign({}, DEF, s.params); syncKnobs(); schedule(); };
      card.addEventListener("click", (e) => { if (e.target !== x) apply(); });
      card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); apply(); } });
      x.addEventListener("click", (e) => { e.stopPropagation(); removeSnap(s); });
    }
  }
  function drawThumb(cv, s) {
    const W = cv.clientWidth || 170, H = 52;
    cv.width = W * dpr; cv.height = H * dpr;
    let m = thumbs.get(s.id); if (!m) { m = buildModel(Object.assign({}, DEF, s.params)); thumbs.set(s.id, m); }
    const ctx = cv.getContext("2d");
    const items = layout(m, "URA裏");
    const px = Math.min(34, Math.floor((W - 16) * 1000 / units(items)));
    drawLine(ctx, m, items, 8, 26 + px * 0.33, px, INK);
  }
  function saveLocal() { try { localStorage.setItem("uraji-snaps", JSON.stringify(snaps)); } catch (e) { /* 保存できない環境 */ } }
  function loadLocal() { try { snaps = JSON.parse(localStorage.getItem("uraji-snaps") || "[]"); } catch (e) { snaps = []; } renderSnaps(); }
  async function addSnap() {
    const s = { params: cleanParams(P), at: new Date().toISOString() };
    if (db && !local) {
      try { await db.collection("snapshots").add(s); return; } catch (e) { local = true; }
    }
    s.id = "l" + Date.now(); snaps.unshift(s); snaps = snaps.slice(0, 24); saveLocal(); renderSnaps();
  }
  async function removeSnap(s) {
    if (db && !local && !s.id.startsWith("l")) { try { await db.doc("snapshots/" + s.id).delete(); return; } catch (e) { /* 下で消す */ } }
    snaps = snaps.filter((t) => t !== s); saveLocal(); renderSnaps();
  }
  async function decide() {
    const d = { params: cleanParams(P), at: new Date().toISOString() };
    const btn = $("decide"); btn.disabled = true;
    if (db && !local) {
      try {
        await db.doc("decision/current").set(d);
        status("この値をこのページに保存した。チャットで「決めた」と送れば、この値で書体を作り直す。");
        btn.disabled = false; return;
      } catch (e) { /* 下の写しへ */ }
    }
    const json = JSON.stringify(d.params);
    status('このページに保存できなかった。下の値をコピーしてチャットに貼れば、この値で作り直す。<button type="button" id="copy" style="margin-left:8px">コピー</button><pre>' + json + "</pre>");
    $("copy").addEventListener("click", () => { navigator.clipboard.writeText(json).then(() => { $("copy").textContent = "コピーした"; }, () => { $("copy").textContent = "選んでコピーして"; }); });
    btn.disabled = false;
  }
  $("snap").addEventListener("click", addSnap);
  $("decide").addEventListener("click", decide);

  function connect() {
    let done = false;
    const timer = setTimeout(() => { if (!done) { local = true; loadLocal(); } }, 10000);
    db.collection("snapshots").orderBy("at", "desc").limit(24).onSnapshot((q) => {
      done = true; clearTimeout(timer); local = false;
      snaps = q.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      renderSnaps();
    }, () => { done = true; clearTimeout(timer); local = true; loadLocal(); });
    db.doc("decision/current").onSnapshot((d) => {
      if (d.exists && !$("status").classList.contains("on")) {
        const v = d.data();
        status('最後に決めた値（' + new Date(v.at).toLocaleString("ja-JP") + '）：' + summary(Object.assign({}, DEF, v.params)).replace("<br>", " ・") +
          ' <button type="button" id="loaddec" style="margin-left:8px">この値を読み込む</button>');
        $("loaddec").addEventListener("click", () => { P = Object.assign({}, DEF, v.params); syncKnobs(); schedule(); });
      }
    }, () => {});
  }
  (async () => {
    try { if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch (e) { db = null; }
    if (db) connect(); else { local = true; loadLocal(); }
  })();

  syncKnobs();
  renderStage();
  renderGrid();
})();
</script>
</body>
</html>
